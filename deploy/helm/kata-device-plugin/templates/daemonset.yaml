apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "kata-device-plugin.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: kata-device-plugin
    app.kubernetes.io/name: kata-device-plugin
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    {{- /* semver build metadata (+) is not label-safe */}}
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | quote }}
spec:
  selector:
    matchLabels:
      app: kata-device-plugin
      app.kubernetes.io/instance: {{ .Release.Name }}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: kata-device-plugin
        app.kubernetes.io/name: kata-device-plugin
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      priorityClassName: system-node-critical
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: kata-device-plugin
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default (printf "v%s" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if not (has .Values.resourceNaming (list "alias" "sku")) }}
          {{- fail "resourceNaming must be \"alias\" or \"sku\"" }}
          {{- end }}
          {{- if ne .Values.resourceNaming "alias" }}
          args:
            - --resource-naming={{ .Values.resourceNaming }}
          {{- end }}
          env:
            # The node address the plugin advertises to the fabric holder,
            # with the fabric view port below (see ARCHITECTURE.md, "Fabric
            # partitions").
            - name: KATA_DEVICE_PLUGIN_HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            {{- with .Values.logFilter }}
            - name: RUST_LOG
              value: {{ . | quote }}
            {{- end }}

          ports:
            # The fabric view service for the in-band publisher: the Service
            # VM reaches the node address on this port, token-gated.  A
            # hostPort keeps it node-local without a Service, matching the
            # endpoint the plugin injects.
            - name: fabric-view
              containerPort: 9877
              hostPort: 9877
              protocol: TCP

          # No privileged flag, no added capabilities — ADR 10000.
          securityContext:
            allowPrivilegeEscalation: false
            # All writes go to hostPath mounts (CDI specs, kubelet socket,
            # the plugin's state), which readOnlyRootFilesystem does not
            # affect.
            readOnlyRootFilesystem: true
            runAsUser: 0                    # kubelet socket ownership requires uid 0
            runAsNonRoot: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ALL]

          volumeMounts:
            - name: kubelet-socket
              mountPath: /var/lib/kubelet/device-plugins
            - name: vfio
              mountPath: /dev/vfio
              readOnly: true
            - name: cdi
              mountPath: /var/run/cdi
            # The fabric view token and the host socket a publisher on the
            # node uses; a pod restart keeps the token the Service VM holds.
            - name: state
              mountPath: /var/run/kata-device-plugin

          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

      volumes:
        - name: kubelet-socket
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
        - name: vfio
          hostPath:
            path: /dev/vfio
            type: DirectoryOrCreate
        - name: cdi
          hostPath:
            path: /var/run/cdi
            type: DirectoryOrCreate
        - name: state
          hostPath:
            path: /var/run/kata-device-plugin
            type: DirectoryOrCreate
