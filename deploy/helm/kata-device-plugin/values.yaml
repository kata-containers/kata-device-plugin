# Only what genuinely varies per cluster is configurable.  The security
# context, hostPath mounts, and priority class are kernel/kubelet/CDI
# contracts baked into the template — overriding them produces a plugin
# that does not work (see ARCHITECTURE.md, ADR 10000).

# Set to the previous release name to retain an existing DaemonSet on upgrade.
fullnameOverride: ""

image:
  repository: ghcr.io/kata-containers/kata-device-plugin
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# Only run where Kata is deployed (label written by kata-deploy).  GPU
# labels are useless here: on a passthrough node the device is VFIO-bound,
# so the host driver never loads and GFD never sees a GPU.  Nodes without
# VFIO devices harmlessly advertise zero capacity.
nodeSelector:
  katacontainers.io/kata-runtime: "true"

# The plugin must start before workload pods on the node.
tolerations:
  - operator: Exists
    effect: NoSchedule

resources:
  requests:
    cpu: 10m
    memory: 20Mi
  limits:
    cpu: 100m
    memory: 64Mi

# alias: table names (nvidia.com/gpu).  sku: hardware identity
# (nvidia.com/GH100_H100_SXM5_80GB).  alias passes no argument, so
# images that predate the flag keep working.
resourceNaming: alias

# tracing_subscriber EnvFilter, e.g. "kata_device_plugin=debug".
# Empty uses the binary's built-in default (kata_device_plugin=info).
logFilter: ""
