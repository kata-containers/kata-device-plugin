[package]
name = "kata-device-plugin"
version = "0.2.0-rc.2"
edition = "2021"

[lib]
name = "kata_device_plugin"
path = "src/lib.rs"

[[bin]]
name = "kata-device-plugin"
path = "src/main.rs"

[dependencies]
anyhow = "1"
futures = "0.3"
hyper-util = "0.1"
# Pinned to the serde-saphyr migration until the next crates.io release.
container-device-interface = { git = "https://github.com/cncf-tags/container-device-interface-rs", rev = "32972e59702cf2ff5d9851bded87bcc1fd962e65" }
# No crates.io release yet; pinned to the main that carries NVLink fabric
# discovery (management ConnectX PFs), which the nvswitch row relies on.
pcilibs-rs = { git = "https://github.com/kata-containers/pcilibs-rs", rev = "43a287d853a2e2337a44ab4c97f413013595a3b8" }
prost = "0.14"
serde-saphyr = { version = "2", default-features = false, features = ["serialize"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = "0.7"
tonic = "0.14"
tonic-prost = "0.14"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
pcilibs-rs = { git = "https://github.com/kata-containers/pcilibs-rs", rev = "43a287d853a2e2337a44ab4c97f413013595a3b8", features = ["testfs"] }
serde_json = "1"
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

[build-dependencies]
tonic-prost-build = "0.14"
