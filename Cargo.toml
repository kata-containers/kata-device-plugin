[package]
name = "kata-device-plugin"
version = "0.2.0-rc.2"
edition = "2021"

[workspace]
# The plugin, the schema of its fabric view service, and the publisher that
# fills that schema from the Fabric Manager SDK: one lock file, so the two
# ends of the Publish call are always built from one commit.
members = ["crates/fabric-api", "crates/fmclient"]

[lib]
name = "kata_device_plugin"
path = "src/lib.rs"

[[bin]]
name = "kata-device-plugin"
path = "src/main.rs"

[dependencies]
anyhow = "1"
futures = "0.3"
hyper-util = "0.1"
# Pinned to the serde-saphyr migration until the next crates.io release.
container-device-interface = { git = "https://github.com/cncf-tags/container-device-interface-rs", rev = "32972e59702cf2ff5d9851bded87bcc1fd962e65" }
kata-fabric-api = { path = "crates/fabric-api" }
# No crates.io release yet; pinned to the commit that carries NVLink fabric
# discovery (management ConnectX PFs), the PCI address of the function behind
# a cdev, which the nvswitch row relies on, and the partition resolution by
# module slot.
pcilibs-rs = { git = "https://github.com/kata-containers/pcilibs-rs", rev = "67564f7" }
prost = "0.14"
serde_json = "1"
serde-saphyr = { version = "2", default-features = false, features = ["serialize"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = "0.7"
tonic = "0.14"
tonic-prost = "0.14"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
pcilibs-rs = { git = "https://github.com/kata-containers/pcilibs-rs", rev = "67564f7", features = ["testfs"] }
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

[build-dependencies]
tonic-prost-build = "0.14"
