name: CI

# Builds the container image from a PR head and pushes it to ghcr.io as
# :pr<N> (mutable, tracks the PR) and :pr<N>-<sha> (immutable), one native
# build per architecture — so test nodes (GB200 arm64, HGX amd64) can pull
# the PR image directly instead of building locally.  Runs that cannot write
# packages build without publishing (see push-image).
on:
  workflow_call:
    inputs:
      commit-hash:
        required: true
        type: string
      pr-number:
        required: true
        type: string
      push-image:
        # Callers must pass false when the run cannot write packages: a fork
        # PR's GITHUB_TOKEN is capped at packages:read no matter what this
        # workflow requests, so the push can only ever fail.
        required: false
        type: boolean
        default: true
  # Allow manual runs against a branch (no PR required).
  workflow_dispatch:
    inputs:
      commit-hash:
        description: "Commit SHA to build (defaults to the dispatched ref)"
        required: false
        type: string
        default: ""
      pr-number:
        description: "Tag suffix: image is pushed as :pr<value>"
        required: false
        type: string
        default: "manual"
      push-image:
        description: "Push to ghcr.io (uncheck to only validate the build)"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-image:
    name: Build image (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_call always passes commit-hash; workflow_dispatch may
          # leave it empty, in which case fall back to the dispatched ref.
          ref: ${{ inputs.commit-hash != '' && inputs.commit-hash || github.sha }}
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ inputs.push-image }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push per-arch image
        env:
          PR: ${{ inputs.pr-number }}
          PUSH: ${{ inputs.push-image }}
        run: |
          set -euxo pipefail
          GIT_SHA=$(git rev-parse --short HEAD)
          TAG="${IMAGE}:pr${PR}-${GIT_SHA}-${{ matrix.arch }}"
          docker build -t "${TAG}" --build-arg GIT_SHA="${GIT_SHA}" .
          if [[ "${PUSH}" != "true" ]]; then
            echo "Token cannot write packages, built ${TAG} without pushing."
            exit 0
          fi
          docker push "${TAG}"

  pr-manifest:
    name: PR manifest
    needs: build-image
    # Nothing was published, so there are no per-arch tags to stitch.
    if: ${{ inputs.push-image }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit-hash != '' && inputs.commit-hash || github.sha }}
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stitch multi-arch PR manifest
        env:
          PR: ${{ inputs.pr-number }}
        run: |
          set -euxo pipefail
          GIT_SHA=$(git rev-parse --short HEAD)
          docker buildx imagetools create \
            -t "${IMAGE}:pr${PR}" \
            -t "${IMAGE}:pr${PR}-${GIT_SHA}" \
            "${IMAGE}:pr${PR}-${GIT_SHA}-amd64" "${IMAGE}:pr${PR}-${GIT_SHA}-arm64"
          echo "pull with: ${IMAGE}:pr${PR}" >> "$GITHUB_STEP_SUMMARY"
