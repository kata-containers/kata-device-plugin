name: Release

# Dispatch-only, NVRC-style: the version is deduced from Cargo.toml — the
# single source of truth — and the matching git tag is created only after the
# image manifest and the Helm chart are published.  No tag-push trigger, so a
# hand-pushed tag can never release a mismatched version.  Builds natively on
# each architecture (no QEMU) and stitches one multi-arch manifest: GB200
# nodes pull arm64, HGX nodes pull amd64.
on:
  workflow_dispatch:

# One release at a time, no queue-jumping cancellation: a second dispatch
# waits instead of racing the first on the latest tag or failing at tag
# creation because both derived the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}
  CHART_DIR: deploy/helm/kata-device-plugin
  # Separate repository from the image so chart and image tags never mix,
  # following kata-deploy's ghcr.io/kata-containers/kata-deploy-charts.
  CHART_REPO: oci://ghcr.io/${{ github.repository }}-charts

jobs:
  preflight:
    name: Derive version from Cargo.toml
    runs-on: ubuntu-24.04
    permissions:
      contents: read # checkout on private repos; authed tag-existence check
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Refuse to release from a non-default branch
        # Expansions go through env, never into the script text (zizmor:
        # template-injection); ref_name is dispatch-chosen input.
        env:
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "${REF_NAME}" != "${DEFAULT_BRANCH}" ]]; then
            echo "Releases are cut from ${DEFAULT_BRANCH} only, not ${REF_NAME}." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: $/.github/actions/rust-toolchain

      - run: sudo apt-get install -y protobuf-compiler

      - name: Check the generated chart contract
        run: |
          cargo run --locked --example generate-resource-contract
          git diff --exit-code -- "${CHART_DIR}/index.json" "${CHART_DIR}/values.schema.json"
          test -z "$(git ls-files --others --exclude-standard -- "${CHART_DIR}/index.json" "${CHART_DIR}/values.schema.json")"

      - name: Derive tag
        id: version
        # cargo metadata rather than grepping the TOML: immune to formatting,
        # trailing comments, and workspace layout.  --locked so metadata can
        # never rewrite Cargo.lock.  Validate the result against the Docker
        # tag charset here — a SemVer like 0.3.0+build1 is legal in
        # Cargo.toml but would only fail at the manifest step, after
        # per-arch images are already pushed.
        run: |
          set -euo pipefail
          ver=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "kata-device-plugin") | .version')
          if [[ ! "${ver}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Version '${ver}' from Cargo.toml is not a Docker-tag-safe semver." >&2
            exit 1
          fi
          {
            echo "version=${ver}"
            echo "tag=v${ver}"
            if [[ "${ver}" == *-* ]]; then
              echo "prerelease=true"
            else
              echo "prerelease=false"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Check the chart matches and lints
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          chart_ver=$(yq -r '.version' "${CHART_DIR}/Chart.yaml")
          app_ver=$(yq -r '.appVersion' "${CHART_DIR}/Chart.yaml")
          if [[ "${chart_ver}" != "${VERSION}" || "${app_ver}" != "${VERSION}" ]]; then
            echo "Chart.yaml has version ${chart_ver} / appVersion ${app_ver}, Cargo.toml has ${VERSION}." >&2
            exit 1
          fi
          helm lint --strict "${CHART_DIR}"

      - name: Fail if the tag already exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
        # Three-way, not boolean: only a definite 404 means the tag is free.
        # Auth or transient API failures must stop the release here, not
        # after the image manifest is already published.
        run: |
          set -euo pipefail
          if out=$(gh api "repos/${REPO}/git/ref/tags/${TAG}" 2>&1); then
            echo "Tag ${TAG} already exists — bump the version in Cargo.toml first." >&2
            exit 1
          elif grep -q "HTTP 404" <<<"${out}"; then
            echo "Tag ${TAG} is free."
          else
            echo "Tag existence check failed: ${out}" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.arch }}
    needs: preflight
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Explicit buildx setup rather than trusting the runner's docker to
      # alias build → buildx: deterministic across runner image changes.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push per-arch image
        id: build
        # --push: buildx pushes as part of the build; no separate docker push.
        # Inline provenance is off because it adds "unknown/unknown" entries
        # to the index; the attestation below records it as an OCI referrer
        # instead.
        run: |
          set -euxo pipefail
          GIT_SHA=$(git rev-parse --short HEAD)
          docker buildx build --push --provenance=false \
            --metadata-file "${RUNNER_TEMP}/metadata.json" \
            -t "${IMAGE}:${GIT_SHA}-${{ matrix.arch }}" --build-arg GIT_SHA="${GIT_SHA}" .
          echo "digest=$(jq -r '."containerimage.digest"' "${RUNNER_TEMP}/metadata.json")" >> "$GITHUB_OUTPUT"

      # A consumer resolving one platform pins the per-architecture digest,
      # not the index's, so each one is attested in its own right.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  manifest:
    name: Multi-arch manifest
    needs: [preflight, build]
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign and attestation signing certificates
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Stitch and tag
        id: stitch
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        run: |
          set -euxo pipefail
          GIT_SHA=$(git rev-parse --short HEAD)
          tags=(-t "${IMAGE}:${TAG}" -t "${IMAGE}:${GIT_SHA}")
          # Whoever pulls :latest must never land on a pre-release by accident.
          if [[ "${PRERELEASE}" != "true" ]]; then
            tags+=(-t "${IMAGE}:latest")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "${IMAGE}:${GIT_SHA}-amd64" "${IMAGE}:${GIT_SHA}-arm64"
          digest=$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign the image
        env:
          DIGEST: ${{ steps.stitch.outputs.digest }}
        # --recursive also signs each per-arch manifest, so a policy that
        # checks the platform digest the node resolved still finds a
        # signature.
        run: cosign sign --yes --recursive "${IMAGE}@${DIGEST}"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.stitch.outputs.digest }}
          push-to-registry: true

  release:
    name: Publish chart and GitHub release
    # Last, deliberately: if a build, the manifest, or the chart push fails,
    # no tag is created, so nothing ever points at an unreleased commit and
    # the preflight "tag exists" check can't block the retry.  A retry just
    # overwrites the already-pushed image and chart tags with identical
    # content.
    needs: [preflight, manifest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the release creates the tag
      packages: write # chart push to ghcr.io
      id-token: write # keyless cosign and attestation signing certificates
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cosign reads registry credentials from the docker config, not helm's.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Package the chart
        run: helm package "${CHART_DIR}" -d dist

      # The OCI chart's layer is this tarball byte for byte, so attesting the
      # file also covers what `helm pull` fetches from the registry.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tgz

      - name: Push the chart
        id: chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euxo pipefail
          helm registry login ghcr.io -u "${ACTOR}" --password-stdin <<<"${GH_TOKEN}"
          out=$(helm push dist/*.tgz "${CHART_REPO}" 2>&1)
          echo "${out}"
          digest=$(sed -n 's/^Digest: //p' <<<"${out}")
          [[ "${digest}" == sha256:* ]]
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign the chart
        env:
          DIGEST: ${{ steps.chart.outputs.digest }}
        run: cosign sign --yes "${CHART_REPO#oci://}/kata-device-plugin@${DIGEST}"

      - name: Create the release and its tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.preflight.outputs.version }}
          TAG: ${{ needs.preflight.outputs.tag }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
          REPO: ${{ github.repository }}
          IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        # gh creates the tag through the API rather than git push, so no git
        # credentials are ever persisted (zizmor).
        run: |
          set -euo pipefail
          flags=()
          if [[ "${PRERELEASE}" == "true" ]]; then
            flags+=(--prerelease)
          fi
          notes=$(cat <<EOF
          Image: \`${IMAGE}:${TAG}\` (linux/amd64, linux/arm64)

          \`\`\`sh
          helm install kata-device-plugin ${CHART_REPO}/kata-device-plugin \\
            --version ${VERSION} -n kube-system
          \`\`\`

          The image and the chart are signed with cosign, and the image, each
          of its architectures and the chart tarball carry build provenance:

          \`\`\`sh
          cosign verify ${IMAGE}:${TAG} \\
            --certificate-identity ${IDENTITY} \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          gh attestation verify oci://${IMAGE}:${TAG} --repo ${REPO}
          cosign verify ${CHART_REPO#oci://}/kata-device-plugin:${VERSION} \\
            --certificate-identity ${IDENTITY} \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          gh attestation verify kata-device-plugin-${VERSION}.tgz --repo ${REPO}
          \`\`\`
          EOF
          )
          gh release create "${TAG}" dist/*.tgz \
            --repo "${REPO}" --target "${GITHUB_SHA}" --title "${TAG}" \
            --notes "${notes}" --generate-notes "${flags[@]}"
