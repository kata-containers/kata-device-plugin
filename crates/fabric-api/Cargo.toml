[package]
name = "kata-fabric-api"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The fabric view kata-device-plugin serves: its wire types, the Publish call's two ends, and the token they agree on"

[dependencies]
prost = "0.14"
serde = { version = "1", features = ["derive"] }
tonic = "0.14"
tonic-prost = "0.14"

[dev-dependencies]
serde_json = "1"

[build-dependencies]
tonic-prost-build = "0.14"
